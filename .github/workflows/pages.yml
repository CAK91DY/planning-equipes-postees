# Publication de la page docs/index.html sur GitHub Pages, sans Jekyll.
# Prérequis : Settings -> Pages -> Source = « GitHub Actions ».
name: Publication de la page

on:
  push:
    branches: [main]
  workflow_dispatch:        # relance manuelle depuis l'onglet Actions

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploiement
        uses: actions/deploy-pages@v4
